# Konfiguracja lokalnego stacku Supabase (CLI v2).
# Start: pnpm db:start  →  pnpm db:reset (migracje + seed)  →  pnpm db:types
project_id = "toolier"

[api]
enabled = true
port = 54321
# Schematy wystawione przez PostgREST.
schemas = ["public", "graphql_public"]
# Schematy przeszukiwane bez podania prefiksu.
extra_search_path = ["public", "extensions"]
# Twardy limit wierszy na zapytanie.
max_rows = 1000

[db]
port = 54322
# Port shadow-bazy uzywanej przez `supabase db diff`.
shadow_port = 54320
# Musi odpowiadac wersji Postgresa w projekcie chmurowym.
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Przechwytywanie maili wychodzacych w local (Mailpit).
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

# Prywatny bucket na zasoby brandu (logo jasne/ciemne).
# Polityki dostepu: supabase/migrations/0005_storage.sql — sciezka {workspace_id}/*.
[storage.buckets.brand]
public = false
file_size_limit = "5MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp", "image/svg+xml"]

[auth]
enabled = true
# Adres dev-serwera Vite (patrz vite.config.ts / tauri.conf.json).
site_url = "http://localhost:1420"
# Deep linki aplikacji desktopowej + adresy dev.
additional_redirect_urls = [
  "http://localhost:1420",
  "http://localhost:1420/**",
  "http://127.0.0.1:1420",
  "toolier://auth/callback",
  "toolier://auth/recovery",
  "toolier://billing/success",
  "toolier://billing/cancel",
  "toolier://billing/return",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8

[auth.email]
enable_signup = true
# W local NIE potwierdzamy maila — user demo z seeda ma dzialac od razu.
enable_confirmations = false
double_confirm_changes = true
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false

# Logowanie zewnetrzne (Google) USUNIETE w T-119. Zostaje wylacznie e-mail
# i haslo. Gdyby kiedys wrocilo, blok `[auth.external.*]` idzie tutaj — ale
# razem z przyciskiem w UI i z wpisem w `capabilities/default.json`, bo bez
# nich sama konfiguracja niczego nie wlacza.

[edge_runtime]
enabled = true
# "oneshot" = restart funkcji przy kazdym zadaniu (wygodne w dev).
policy = "oneshot"
inspector_port = 8083

# Edge Functions (T-14). Webhook Stripe nie dostaje JWT — podpis
# weryfikujemy przez STRIPE_WEBHOOK_SECRET wewnatrz funkcji.
#
# ODKOMENTUJ przy T-14, RAZEM z utworzeniem katalogow funkcji.
# `supabase start` czyta te sekcje i przerywa start, jesli katalog
# `supabase/functions/<nazwa>/index.ts` nie istnieje.
# [functions.stripe-webhook]
# verify_jwt = false
#
# [functions.stripe-create-checkout]
# verify_jwt = true
#
# [functions.stripe-create-portal]
# verify_jwt = true

# Powiadomienia e-mail (T-116). `verify_jwt = false`, bo funkcje wola tez cron
# — bez uzytkownika i bez tokenu. Autoryzacja jest w srodku i osobna dla kazdej
# akcji: `drain` chce naglowka `x-notify-secret` albo klucza service_role,
# `test` chce tokenu zalogowanego wlasciciela.
#
# Wdrozenie: supabase functions deploy notify --no-verify-jwt
[functions.notify]
verify_jwt = false

[analytics]
enabled = false
