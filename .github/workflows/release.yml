name: Wydanie

# Ręcznie albo tagiem `v1.0.1`. Świadomie NIE na każdy push do `main`:
# wydanie to decyzja, a nie skutek uboczny commita.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon i Intel osobno — uniwersalna binarka podwaja rozmiar
          # paczki, a updater i tak wybiera właściwą po `target`.
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # BEZ `version:` — wersje pnpm podaje `packageManager` w package.json.
      # Podanie jej w obu miejscach jest bledem, nie duplikatem: action-setup
      # odmawia startu, zeby nie zbudowac paczki inna wersja niz lokalna.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: pnpm install --frozen-lockfile

      # ------------------------------------------------------------------
      # Klucz sprawdzamy PRZED kompilacją Rusta.
      #
      # Bez tego kroku zły sekret ujawnia się dopiero na samym końcu, po
      # ~25 minutach budowania — i to komunikatem, który brzmi jak problem
      # z hasłem, a zwykle znaczy, że treść klucza została ucięta przy
      # kopiowaniu z terminala. Tutaj kosztuje sekundy.
      #
      # CLI czyta TAURI_SIGNING_PRIVATE_KEY i ...PASSWORD ze środowiska,
      # więc nie podajemy żadnych flag — sprawdzamy dokładnie tę drogę,
      # którą pójdzie prawdziwy build.
      # ------------------------------------------------------------------
      - name: Sprawdź klucz podpisujący aktualizacje
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Sekret TAURI_SIGNING_PRIVATE_KEY jest pusty."
            exit 1
          fi
          echo "Długość sekretu: ${#TAURI_SIGNING_PRIVATE_KEY} znaków."
          echo "proba" > klucz-test.txt
          if ! pnpm tauri signer sign klucz-test.txt > /dev/null 2>&1; then
            echo "::error::Klucz podpisujący nie działa. Najczęstsza przyczyna: treść sekretu została ucięta przy kopiowaniu. Wklej CAŁY plik .tauri/updater.key jednym ciągiem."
            exit 1
          fi
          echo "Klucz podpisujący działa."
          rm -f klucz-test.txt klucz-test.txt.sig

      # ------------------------------------------------------------------
      # Tag MUSI zgadzać się z wersją aplikacji.
      #
      # ⚠️ To jest zabezpieczenie przed błędem, który przeszedł niezauważony
      # w wydaniu v1.1.1 (2026-08-27) i objawił się dopiero u użytkownika:
      # aplikacja na drugim komputerze mówiła „masz najnowszą wersję", choć
      # wydanie było nowsze.
      #
      # Dlaczego nikt tego nie złapał: `tagName` bierze się z gita, ale numer
      # wersji w `latest.json` i w zbudowanej aplikacji pochodzi z
      # `tauri-conf.json`. Tag podbity bez podbicia pliku daje wydanie
      # NAZWANE v1.1.1, w którym aplikacja przedstawia się jako 1.1.0 —
      # a updater porównuje właśnie te numery, nie nazwę wydania.
      # `1.1.0 > 1.1.0` jest fałszem, więc aplikacja melduje „aktualna”.
      #
      # Build kończył się sukcesem, wydanie wyglądało poprawnie, a jedynym
      # sygnałem był brak aktualizacji na cudzym komputerze. Ten krok zamienia
      # to w czerwony build w 5 sekund.
      # ------------------------------------------------------------------
      - name: Sprawdź zgodność tagu z wersją aplikacji
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          cargo=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)

          echo "tag=$tag  tauri.conf.json=$conf  package.json=$pkg  Cargo.toml=$cargo"

          fail=0
          for para in "tauri.conf.json:$conf" "package.json:$pkg" "Cargo.toml:$cargo"; do
            plik="${para%%:*}"
            wersja="${para#*:}"
            if [ "$wersja" != "$tag" ]; then
              echo "::error::$plik ma wersję $wersja, a tag mówi $tag. Podbij wersję we WSZYSTKICH trzech plikach i przetaguj — inaczej updater uzna nowe wydanie za tę samą wersję i nikt go nie dostanie."
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

          echo "Wersje zgodne."

      # Bramka jakości przed wydaniem. Wypuszczenie paczki, która nie
      # przechodzi własnych testów, jest gorsze niż brak wydania.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Klucz podpisujący aktualizacje. Bez niego `latest.json` powstanie
          # bez podpisów, a aplikacja odrzuci taką aktualizację.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Podpis i notaryzacja macOS.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Frontend potrzebuje adresu Supabase i strony ofert już na etapie builda.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_SHARE_BASE_URL: ${{ secrets.VITE_SHARE_BASE_URL }}
          VITE_APP_ENV: prod
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', 'dev') }}
          releaseName: 'Toolier __VERSION__'
          releaseBody: 'Lista zmian: CHANGELOG.md'
          # Szkic, nie publikacja: `latest.json` staje się widoczny dla
          # wszystkich aplikacji w chwili opublikowania wydania, więc ten
          # moment ma wybrać człowiek.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
