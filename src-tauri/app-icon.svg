<!--
  Master ikony aplikacji (T-75). Źródło dla `pnpm tauri icon`.

  Sygnet na BEŻU, nie na przezroczystości: ikona na ciemnym pasku zadań
  Windows byłaby brązem na czerni i praktycznie by zniknęła.

  Kwadrat jest pełnospadowy — tak wygląda natywnie w pasku zadań i w
  kafelkach Windows, dla których `tauri icon` generuje Square*Logo.png.
  Zaokrąglenie „squircle" pod macOS to osobny krok przy budowie na macu
  (T-17); dorobienie go tutaj zepsułoby kafelki Windows.

  Glif zajmuje ~62% wysokości — reszta to margines optyczny, żeby przy
  32×32 sygnet nie dotykał krawędzi.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <rect width="1024" height="1024" fill="#efece8"/>
