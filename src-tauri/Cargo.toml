[package]
name = "toolier"
version = "1.2.0"
description = "Toolier — interaktywne wyceny z brandowanym PDF"
authors = ["Toolier"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "toolier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-deep-link = "2"
# Auto-update (T-19). Tylko desktop — na mobile updater nie ma sensu,
# bo dystrybucja idzie przez sklepy.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Lokalna baza offline (T-29). Tylko `sqlite` — Postgres i MySQL doklada
# sterowniki, ktorych aplikacja desktopowa nigdy nie uzyje.
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
